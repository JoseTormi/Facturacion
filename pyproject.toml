[project]
name = "extraccion-facturas"
version = "0.1.0"
description = "Automatizacion para descargar facturas de portales, extraer informacion y generar Excel."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "playwright>=1.44.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "typer>=0.12.3",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[project.scripts]
facturas = "invoice_automation.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
